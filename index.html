<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fábrica de Conteúdos - Legendas Assertivas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 400: '#ff7332', 500: '#FF7E05', 600: '#ef3b00', 950: '#f5f5f5' }, brisa: { blue: '#0022cc' } }, fontFamily: { sans: ['Inter', 'sans-serif'], figtree: ['Figtree', 'sans-serif'] } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #f3f4f6; color: #1f2937; overflow-x: hidden; }
        
        #particles-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        .meta-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 20px; transition: all 0.4s; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); position: relative; overflow: hidden; backdrop-filter: blur(10px); z-index: 10;}
        .meta-card:not(.disabled):hover { border: 1px solid rgba(255, 126, 5, 0.3); transform: translateY(-3px); box-shadow: 0 15px 35px -5px rgba(255, 126, 5, 0.15); }
        .disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; background: #f9fafb; }
        .btn-primary { background: linear-gradient(135deg, #FF7E05 0%, #ef3b00 100%); color: white; box-shadow: 0 4px 15px rgba(255, 126, 5, 0.3); border: none; transition: all 0.3s; cursor: pointer; z-index: 10; position: relative;}
        .btn-primary:hover { box-shadow: 0 8px 25px rgba(255, 126, 5, 0.4); transform: translateY(-3px) scale(1.02); }
        input[type="url"] { background: #f9fafb; border: 1px solid #e5e7eb; color: #1f2937; position: relative; z-index: 10;}
        input[type="url"]:focus { outline: none; border-color: #FF7E05; box-shadow: 0 0 0 3px rgba(255,126,5,0.1); }
        #left-stripe { position: fixed; top: 0; left: 0; height: 100dvh; width: 24px; background-color: #0022cc; z-index: 100; }
        @media (min-width: 768px) { #left-stripe { width: 40px; } }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-[100dvh] pl-6 md:pl-10">
    <div id="left-stripe"></div>
    
    <canvas id="particles-canvas"></canvas>

    <div id="processing-overlay" style="display: none;" class="fixed inset-0 z-[100] bg-white/95 backdrop-blur-md flex-col items-center justify-center transition-opacity duration-500 opacity-0 pl-6 md:pl-10">
        <div class="w-24 h-24 mb-6 relative flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-t-4 border-brand-500 animate-spin" style="animation-duration: 1.5s;"></div>
            <span id="loading-percentage" class="text-gray-900 font-figtree font-black text-xl absolute">0%</span>
        </div>
        <h2 class="text-3xl md:text-4xl font-figtree font-black text-brand-500 tracking-widest animate-pulse text-center px-4">PROCESSANDO DADOS...</h2>
        <p id="processing-subtitle" class="text-gray-600 font-medium mt-4 max-w-md text-center text-sm md:text-lg px-4 transition-all duration-300">Sincronizando IA e formatando SRT dinâmico.</p>
    </div>

    <div id="start-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 bg-[#f3f4f6]/90 backdrop-blur-sm transition-all duration-700 ease-in-out pl-6 md:pl-10">
        <img src="https://raw.githubusercontent.com/gilnei-ship-it/fegil/main/Logo%20(3).png" alt="Logo" class="w-64 md:w-80 mb-6 drop-shadow-lg relative z-10">
        <button id="btn-start" class="btn-primary mt-12 px-12 py-4 rounded-full text-sm font-bold tracking-widest uppercase shadow-2xl shadow-brand-500/50">Ativar Sistema</button>
    </div>

    <main id="main-ui" class="opacity-0 pointer-events-none absolute inset-0 flex flex-col lg:flex-row w-full max-w-7xl mx-auto h-[100dvh] z-10 p-4 md:p-8 gap-8 lg:gap-12 transition-opacity duration-1000 ease-in-out">
        <div class="w-full lg:w-5/12 flex flex-col justify-center relative z-10 pointer-events-none">
            <img src="https://raw.githubusercontent.com/gilnei-ship-it/fegil/main/Logo%20(3).png" class="w-48 md:w-56 drop-shadow-md mb-2 absolute top-0 left-0 pt-2 md:pt-4">
            
            <div class="relative w-64 h-64 md:w-80 md:h-80 mt-24 mx-auto flex-shrink-0">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alegria&mouth=smile01,smile02&eyes=happy,glow&baseColor=FF7E05&primaryColor=FF7E05" class="w-full h-full object-contain relative z-10 drop-shadow-2xl">
                <!-- Balão de fala e textos foram totalmente removidos daqui -->
            </div>
        </div>

        <div class="w-full lg:w-7/12 flex flex-col justify-center gap-5 z-10 pointer-events-auto">
            <div class="meta-card p-6 flex flex-col justify-center w-full border-t-4 border-t-brand-500">
                <h3 class="text-gray-900 font-black text-lg mb-1">1. Entrada de Arquivos</h3>
                <input type="url" id="input-link-video" placeholder="Insira a URL (ou URLs separadas por vírgula)..." class="w-full text-sm p-4 rounded-xl shadow-inner font-medium mb-4 bg-gray-50 border border-gray-200">
                <label class="w-full flex flex-col items-center px-4 py-6 bg-gray-50 text-gray-600 rounded-xl border-2 border-gray-300 border-dashed cursor-pointer hover:bg-brand-50 hover:border-brand-500 transition-all">
                    <span id="file-name-display" class="text-sm font-bold">Selecionar arquivos locais (Múltiplos)</span>
                    <input type='file' id="input-file-video" accept="video/mp4,video/*" multiple class="hidden" />
                </label>
            </div>

            <div id="wrapper-cortes" class="meta-card disabled relative transition-all">
                <button onclick="executarIA()" class="w-full p-6 flex items-center text-left bg-transparent border-none cursor-pointer">
                    <div>
                        <h3 class="text-gray-900 font-black text-lg mb-1 text-brisa-blue">2. Processar Lote</h3>
                        <p class="text-gray-600 text-xs font-medium">Extração de áudio, processamento estrutural e renderização de SRT.</p>
                    </div>
                </button>
            </div>

            <div id="download-zone" class="hidden flex flex-col gap-3 mt-2">
                <h4 class="text-gray-900 font-black text-sm uppercase tracking-wider">Arquivos Gerados:</h4>
                <div id="download-buttons-list" class="flex flex-col gap-2 max-h-64 overflow-y-auto pr-2 pb-2"></div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // ANIMAÇÃO (ENGRENAGENS VAZADAS)
        // ==========================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, gears = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize); 
        resize();

        class GearOutline {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.s = Math.random() * 20 + 20; 
                this.vx = (Math.random() - 0.5) * 0.4; 
                this.vy = (Math.random() - 0.5) * 0.4;
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.01; 
                this.color = 'rgba(0, 34, 204, 0.25)'; 
            }
            update() {
                this.x += this.vx; 
                this.y += this.vy;
                this.angle += this.vAngle;
                if (this.x < -this.s*2 || this.x > width + this.s*2) this.vx *= -1;
                if (this.y < -this.s*2 || this.y > height + this.s*2) this.vy *= -1;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3.5;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                ctx.beginPath();
                let spikes = 8;
                let outer = this.s;
                let inner = this.s * 0.75;
                
                for (let i = 0; i <= spikes * 2; i++) {
                    let r = (i % 2 === 0) ? outer : inner;
                    let a = (i * Math.PI) / spikes;
                    if (i === 0) ctx.moveTo(r, 0);
                    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, this.s * 0.35, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        for (let i = 0; i < 30; i++) gears.push(new GearOutline());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            gears.forEach(g => { g.update(); g.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // ==========================================
        // EFEITO SONORO (ARPEJO DIGITAL)
        // ==========================================
        function tocarSomSucesso() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                
                const notas = [523.25, 659.25, 783.99, 1046.50];
                const tempoBase = ctx.currentTime;

                notas.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, tempoBase + (index * 0.1));

                    gain.gain.setValueAtTime(0, tempoBase + (index * 0.1));
                    gain.gain.linearRampToValueAtTime(0.15, tempoBase + (index * 0.1) + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, tempoBase + (index * 0.1) + 0.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(tempoBase + (index * 0.1));
                    osc.stop(tempoBase + (index * 0.1) + 0.6);
                });
            } catch (e) {
                console.log("Áudio bloqueado pelo navegador.");
            }
        }

        // ==========================================
        // SISTEMA TTS (VOZ MASCULINA JOVEM / ESTILO ROBÔ GOOGLE)
        // ==========================================
        const API_BASE = "https://suave-unshackle-chug.ngrok-free.dev";
        window.arquivosGerados = {}; 
        const synth = window.speechSynthesis;
        let vozSelecionada = null;

        synth.onvoiceschanged = () => {
            let vozes = synth.getVoices();
            let vozesPT = vozes.filter(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
            
            let vozJovem = vozesPT.find(v => 
                v.name.includes('Google') || 
                v.name.includes('Natural') || 
                v.name.includes('Thiago') ||
                v.name.includes('Daniel')
            );
            
            vozSelecionada = vozJovem || vozesPT[0];
        };

        function falar(texto) {
            if (synth.speaking) synth.cancel();
            
            const utterThis = new SpeechSynthesisUtterance(texto);
            utterThis.lang = 'pt-BR';
            
            // Ritmo dinâmico e tom jovem (pitch)
            utterThis.rate = 1.1;  
            utterThis.pitch = 1.2; 

            if (vozSelecionada) {
                utterThis.voice = vozSelecionada;
            }

            synth.speak(utterThis);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none'; 
            document.getElementById('main-ui').classList.remove('opacity-0', 'pointer-events-none'); 
            
            if (!vozSelecionada && synth.getVoices().length > 0) {
                synth.onvoiceschanged();
            }
            
            falar("Olá. Eu sou a Inteligência da Fábrica de Conteúdos Brisanet. Insira a URL ou os arquivos de vídeo e eu executarei a formatação da legenda.");
        });

        document.getElementById('input-link-video').addEventListener('input', function() {
            if(this.value.includes('http')) {
                document.getElementById('wrapper-cortes').classList.remove('disabled');
                falar("Link recebido. Aguardando comando para iniciar o processamento do lote.");
            }
        });

        document.getElementById('input-file-video').addEventListener('change', function() {
            const numFiles = this.files.length;
            if(numFiles > 0) {
                let displayName = "";
                if (numFiles === 1) {
                    const fileName = this.files[0].name;
                    displayName = fileName.length > 25 ? fileName.substring(0, 22) + '...' : fileName;
                } else {
                    displayName = `${numFiles} arquivos de mídia na fila`;
                }
                const displayEl = document.getElementById('file-name-display');
                displayEl.innerText = displayName;
                displayEl.classList.add('text-brand-500');
                
                document.getElementById('wrapper-cortes').classList.remove('disabled');
                falar("Arquivos validados. O motor está pronto para gerar as legendas.");
            }
        });

        function baixarArquivoDireto(nomeArquivo) {
            try {
                const arq = window.arquivosGerados[nomeArquivo];
                const byteCharacters = atob(arq.conteudo);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                
                let mimeType = arq.tipo === 'srt' ? 'text/plain;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                const blob = new Blob([byteArray], { type: mimeType });

                const urlBlob = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = urlBlob;
                a.download = arq.arquivo;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(urlBlob);
                }, 100);
                
                falar("Download concluído com sucesso.");
            } catch (e) {
                alert("Falha de execução na renderização do arquivo.");
                console.error(e);
            }
        }

        async function executarIA() {
            const linkVideo = document.getElementById('input-link-video').value.trim();
            const videoFiles = document.getElementById('input-file-video').files;
            const overlay = document.getElementById('processing-overlay');
            const subtitleEl = document.getElementById('processing-subtitle');
            
            falar("Iniciando varredura do lote de vídeos. Aguarde.");
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);

            try {
                let formData = new FormData();
                if (videoFiles.length > 0) {
                    for (let i = 0; i < videoFiles.length; i++) {
                        formData.append("video_files", videoFiles[i]);
                    }
                } else {
                    formData.append("link_video", linkVideo);
                }

                await fetch(`${API_BASE}/processar-video`, {
                    method: 'POST',
                    headers: { 'ngrok-skip-browser-warning': 'true' },
                    body: formData
                });

                let poll = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/status`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
                        const statusData = await res.json();

                        if (subtitleEl && statusData.mensagem) {
                            subtitleEl.innerText = statusData.mensagem;
                        }
                        document.getElementById('loading-percentage').innerText = `${statusData.progresso}%`;
                        
                        if (statusData.erro) {
                            clearInterval(poll);
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.style.display = 'none', 500);
                            falar("Erro crítico no servidor backend.");
                            alert("ERRO: " + statusData.erro);
                        }

                        if(statusData.progresso === 100) {
                            clearInterval(poll);
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.style.display = 'none', 500);

                            tocarSomSucesso();

                            const list = document.getElementById('download-buttons-list');
                            list.innerHTML = '';

                            statusData.modulos.forEach(item => {
                                window.arquivosGerados[item.arquivo] = item; 
                                list.innerHTML += `
                                    <button onclick="baixarArquivoDireto('${item.arquivo}')" class="w-full p-4 bg-brisa-blue text-white rounded-xl font-bold flex items-center justify-between hover:bg-brand-500 transition-colors shadow-lg cursor-pointer border-none text-left">
                                        <span class="truncate w-48 md:w-64">📥 ${item.modulo}</span>
                                        <span class="text-xs bg-white/20 px-3 py-1 rounded shadow-inner flex-shrink-0">BAIXAR</span>
                                    </button>`;
                            });

                            document.getElementById('download-zone').classList.remove('hidden');
                            falar("Processamento finalizado com sucesso. Lote disponível para download.");
                        }
                    } catch (e) {
                        console.error("Erro no polling:", e);
                    }
                }, 2000);
            } catch (error) {
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.style.display = 'none', 300);
                falar("Falha na conexão com o sistema.");
            }
        }
    </script>
</body>
</html>
