<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fff5f0', 100: '#ffe8d9', 400: '#ff7332', 500: '#FF7E05', 600: '#ef3b00' },
                        brisa: { blue: '#0022cc', light: '#e6ebff', ghost: '#f0f3ff' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        figtree: ['Figtree', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float 12s ease-in-out infinite',
                        'float-slower': 'float 18s ease-in-out infinite',
                        'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(2deg)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }

    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #fafbfc; color: #1f2937; overflow-x: hidden; }
        
        #left-stripe { position: fixed; top: 0; left: 0; height: 100dvh; width: 6px; background: linear-gradient(to bottom, #0022cc, #FF7E05); z-index: 100; box-shadow: 2px 0 10px rgba(0, 34, 204, 0.2); }
        @media (min-width: 768px) { #left-stripe { width: 8px; } }

        .meta-card { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 20px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08); position: relative; overflow: hidden; z-index: 10;}
        .meta-card:not(.disabled):hover { border-color: rgba(255, 126, 5, 0.4); transform: translateY(-2px); box-shadow: 0 15px 35px -10px rgba(255, 126, 5, 0.2); }
        .disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; filter: grayscale(40%); }
        
        input[type="url"] { background: #ffffff; border: 1px solid #e2e8f0; color: #1f2937; transition: all 0.3s ease; position: relative; z-index: 10;}
        input[type="url"]:focus { outline: none; border-color: #FF7E05; box-shadow: 0 0 0 3px rgba(255,126,5,0.1); }
        
        .btn-primary { background: linear-gradient(135deg, #FF7E05 0%, #ef3b00 100%); color: white; border: none; cursor: pointer; position: relative; overflow: hidden; transition: all 0.3s ease; box-shadow: 0 4px 15px -3px rgba(255, 126, 5, 0.4); z-index: 10;}
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -3px rgba(255, 126, 5, 0.5); }

        .scanner-line { position: absolute; left: 0; width: 100%; height: 2px; background: #FF7E05; box-shadow: 0 0 10px #FF7E05, 0 0 20px #FF7E05; animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        @keyframes rise { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(-20vh) scale(1.5); opacity: 0; } }
        .particle { position: absolute; bottom: -10px; border-radius: 50%; pointer-events: none; opacity: 0; animation: rise linear forwards; z-index: 1; }
        
        .screen-out { opacity: 0; transform: scale(1.05); pointer-events: none; }
    </style>
</head>

    <script>
        // ==========================================
        // SITEMA DE ANTI-HIBERNAÇÃO (WAKE LOCK API)
        // ==========================================
        let wakeLock = null;

        async function ativarAntiHibernacao() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Sistema Anti-Hibernação ativado. A tela não vai apagar.');
                }
            } catch (err) {
                console.log(`Falha ao travar a tela: ${err.name}, ${err.message}`);
            }
        }

        function desativarAntiHibernacao() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    console.log('Sistema Anti-Hibernação liberado.');
                });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                ativarAntiHibernacao();
            }
        });

        // ==========================================
        // TEXTOS E EXPLOSÃO DE PARTÍCULAS NO OVERLAY
        // ==========================================
        const frasesProcesso = [
            "Mapeando espectro de voz em alta definição...",
            "Sincronizando frames com palavras exatas...",
            "Fatiando texto para leitura dinâmica...",
            "Revisando pontuação e contexto lógico...",
            "Preparando SRT perfeito para a timeline..."
        ];
        let intervaloFrases, intervaloParticulas;

        function iniciarAnimacoesOverlay() {
            const container = document.getElementById('particles-container');
            if (container) container.innerHTML = '';
            
            intervaloParticulas = setInterval(() => {
                for (let i = 0; i < 4; i++) {
                    const p = document.createElement('div');
                    p.className = `particle ${Math.random() > 0.5 ? 'bg-brand-500' : 'bg-brisa-blue'}`;
                    const size = Math.random() * 8 + 4; 
                    p.style.width = `${size}px`;
                    p.style.height = `${size}px`;
                    p.style.left = `${Math.random() * 100}vw`;
                    p.style.animationDuration = `${Math.random() * 1.5 + 1.5}s`; 
                    if (container) container.appendChild(p);
                    
                    setTimeout(() => { if (p.parentNode) p.remove(); }, 3000);
                }
            }, 100);

            const subtitle = document.getElementById('processing-subtitle');
            let index = 0;
            if (subtitle) {
                subtitle.innerText = frasesProcesso[0];
                subtitle.style.opacity = '1';
                intervaloFrases = setInterval(() => {
                    subtitle.style.opacity = '0';
                    setTimeout(() => {
                        index = (index + 1) % frasesProcesso.length;
                        subtitle.innerText = frasesProcesso[index];
                        subtitle.style.opacity = '1';
                    }, 500); 
                }, 3000);
            }
        }

        function pararAnimacoesOverlay() {
            clearInterval(intervaloParticulas);
            clearInterval(intervaloFrases);
        }

        // ==========================================
        // SISTEMA TTS, LÓGICA E SUCESSO
        // ==========================================
        const API_BASE = "https://suave-unshackle-chug.ngrok-free.dev";
        window.arquivosGerados = {}; 
        const synth = window.speechSynthesis;
        let vozSelecionada = null;

        let progressoAtual = 0;
        let progressoAlvo = 0;
        let loopProgresso;

        function animarProgresso() {
            if (progressoAtual < progressoAlvo) {
                progressoAtual++;
                document.getElementById('loading-percentage').innerText = `${progressoAtual}%`;
            }
            loopProgresso = setTimeout(animarProgresso, 30);
        }

        function tocarSomSucesso() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const notas = [523.25, 659.25, 783.99, 1046.50];
                const tempoBase = ctx.currentTime;
                notas.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, tempoBase + (index * 0.1));
                    gain.gain.setValueAtTime(0, tempoBase + (index * 0.1));
                    gain.gain.linearRampToValueAtTime(0.15, tempoBase + (index * 0.1) + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, tempoBase + (index * 0.1) + 0.5);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(tempoBase + (index * 0.1));
                    osc.stop(tempoBase + (index * 0.1) + 0.6);
                });
            } catch (e) { console.log("Áudio bloqueado."); }
        }

        synth.onvoiceschanged = () => {
            let vozes = synth.getVoices();
            let vozesPT = vozes.filter(v => v.lang.includes('pt-BR') || v.lang.includes('pt_BR'));
            let vozJovem = vozesPT.find(v => v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Thiago') || v.name.includes('Daniel'));
            vozSelecionada = vozJovem || vozesPT[0];
        };

        function falar(texto) {
            if (synth.speaking) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(texto);
            utterThis.lang = 'pt-BR';
            utterThis.rate = 1.1;  
            utterThis.pitch = 1.2; 
            if (vozSelecionada) utterThis.voice = vozSelecionada;
            synth.speak(utterThis);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none'; 
            document.getElementById('main-ui').classList.remove('opacity-0', 'pointer-events-none'); 
            if (!vozSelecionada && synth.getVoices().length > 0) synth.onvoiceschanged();
            
            // CORREÇÃO FONÉTICA "Briza néti"
            falar("Olá. Eu sou a Inteligência da Fábrica de Conteúdos Briza néti. Insira a URL ou os arquivos de vídeo e eu executarei a formatação da legenda.");
        });

        document.getElementById('input-link-video').addEventListener('input', function() {
            if(this.value.includes('http')) {
                document.getElementById('wrapper-cortes').classList.remove('disabled');
                falar("Link recebido. Aguardando comando para iniciar o processamento do lote.");
            }
        });

        document.getElementById('input-file-video').addEventListener('change', function() {
            const numFiles = this.files.length;
            if(numFiles > 0) {
                let displayName = numFiles === 1 ? (this.files[0].name.length > 25 ? this.files[0].name.substring(0, 22) + '...' : this.files[0].name) : `${numFiles} arquivos de mídia na fila`;
                const displayEl = document.getElementById('file-name-display');
                displayEl.innerText = displayName;
                displayEl.classList.add('text-brand-500');
                document.getElementById('wrapper-cortes').classList.remove('disabled');
                falar("Arquivos validados. O motor está pronto para gerar as legendas.");
            }
        });

        function baixarArquivoDireto(nomeArquivo) {
            try {
                const arq = window.arquivosGerados[nomeArquivo];
                const byteCharacters = atob(arq.conteudo);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
                const byteArray = new Uint8Array(byteNumbers);
                let mimeType = arq.tipo === 'srt' ? 'text/plain;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                const blob = new Blob([byteArray], { type: mimeType });
                const urlBlob = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none'; a.href = urlBlob; a.download = arq.arquivo;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(urlBlob); }, 100);
            } catch (e) { alert("Falha na renderização."); console.error(e); }
        }

        async function executarIA() {
            const linkVideo = document.getElementById('input-link-video').value.trim();
            const videoFiles = document.getElementById('input-file-video').files;
            const overlay = document.getElementById('processing-overlay');
            const titleEl = document.getElementById('processing-title');
            
            if (videoFiles.length === 0 && linkVideo === '') {
                falar("Por favor, selecione um arquivo ou cole um link antes de continuar.");
                alert("ERRO: Selecione um arquivo ou cole um link válido!");
                return;
            }
            
            ativarAntiHibernacao();

            falar("Enviando mídia para a nuvem. Aguarde.");
            titleEl.innerHTML = `<svg class="w-6 h-6 text-brand-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Enviando arquivos...`;
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            
            progressoAtual = 0; progressoAlvo = 0;
            clearTimeout(loopProgresso); animarProgresso(); 
            iniciarAnimacoesOverlay(); 

            try {
                let formData = new FormData();
                if (videoFiles.length > 0) {
                    for (let i = 0; i < videoFiles.length; i++) formData.append("video_files", videoFiles[i]);
                } 
                if (linkVideo !== '') {
                    formData.append("link_video", linkVideo);
                }

                const respostaPost = await fetch(`${API_BASE}/processar-video`, { method: 'POST', headers: { 'ngrok-skip-browser-warning': 'true' }, body: formData });
                const dadosPost = await respostaPost.json();

                if (dadosPost.status === "erro") {
                    throw new Error("Servidor recusou os arquivos.");
                }

                let poll = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/status`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
                        const statusData = await res.json();
                        
                        progressoAlvo = statusData.progresso;
                        
                        if (titleEl && statusData.mensagem) {
                            titleEl.innerHTML = `<svg class="w-6 h-6 text-brand-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> ${statusData.mensagem}`;
                        }

                        if (statusData.erro) {
                            clearInterval(poll); pararAnimacoesOverlay(); overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.style.display = 'none', 500);
                            falar("Erro crítico no servidor backend."); alert("ERRO: " + statusData.erro);
                            desativarAntiHibernacao(); 
                        }

                        if(statusData.progresso === 100) {
                            clearInterval(poll); progressoAlvo = 100;
                            setTimeout(() => {
                                pararAnimacoesOverlay(); tocarSomSucesso();
                                overlay.classList.add('opacity-0'); setTimeout(() => overlay.style.display = 'none', 500);
                                
                                const list = document.getElementById('download-buttons-list'); list.innerHTML = '';
                                statusData.modulos.forEach(item => {
                                    window.arquivosGerados[item.arquivo] = item; 
                                    list.innerHTML += `
                                        <button onclick="baixarArquivoDireto('${item.arquivo}')" class="w-full p-4 bg-white border border-gray-100 text-gray-700 rounded-xl font-figtree font-bold flex items-center justify-between hover:border-brisa-blue hover:shadow-md transition-all cursor-pointer text-left group">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-full bg-brisa-light text-brisa-blue flex items-center justify-center group-hover:bg-brisa-blue group-hover:text-white transition-colors">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                                </div>
                                                <span class="text-sm truncate w-40 md:w-56" title="${item.modulo}">${item.modulo}</span>
                                            </div>
                                            <span class="text-[10px] bg-gray-50 px-2 py-1 rounded text-gray-500 group-hover:text-brisa-blue font-bold uppercase tracking-wide border border-gray-100 flex-shrink-0">Baixar</span>
                                        </button>`;
                                });
                                document.getElementById('download-zone').classList.remove('hidden');
                                falar("Processamento finalizado com sucesso. Iniciando download automático das legendas para o Premiere.");

                                // Gatilho de download automático das legendas SRT
                                statusData.modulos.forEach((item, index) => {
                                    if (item.tipo === 'srt') {
                                        setTimeout(() => {
                                            baixarArquivoDireto(item.arquivo);
                                        }, index * 400); 
                                    }
                                });

                                desativarAntiHibernacao(); 
                            }, 1200);
                        }
                    } catch (e) { console.error("Erro no polling:", e); }
                }, 2000);
            } catch (error) {
                pararAnimacoesOverlay(); overlay.classList.add('opacity-0'); setTimeout(() => overlay.style.display = 'none', 300);
                alert("Falha de conexão com o sistema (Verifique se o Colab está rodando e se a tela do Ngrok foi liberada).");
                desativarAntiHibernacao(); 
            }
        }
    </script>
