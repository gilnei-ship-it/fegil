<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Fábrica de Conteúdos - Legendas Assertivas</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fff5f0', 100: '#ffe8d9', 400: '#ff7332', 500: '#FF7E05', 600: '#ef3b00' },
                        brisa: { blue: '#0022cc', light: '#e6ebff' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        figtree: ['Figtree', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float 12s ease-in-out infinite',
                        'float-slower': 'float 18s ease-in-out infinite',
                        'spin-slow': 'spin 15s linear infinite',
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'scale-in': 'scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(5deg)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.9)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #f8fafc;
            color: #1f2937;
            overflow-x: hidden;
        }

        #left-stripe {
            position: fixed; top: 0; left: 0; height: 100dvh; width: 6px;
            background: linear-gradient(to bottom, #0022cc, #FF7E05);
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0, 34, 204, 0.2);
        }
        @media (min-width: 768px) { #left-stripe { width: 8px; } }

        .meta-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            position: relative; overflow: hidden;
        }
        
        .meta-card:not(.disabled):hover {
            border-color: rgba(255, 126, 5, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -10px rgba(255, 126, 5, 0.15);
        }

        .disabled {
            opacity: 0.6; cursor: not-allowed; pointer-events: none;
            filter: grayscale(40%);
        }

        input[type="url"] {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            color: #1f2937;
            transition: all 0.3s ease;
        }
        input[type="url"]:focus {
            outline: none; border-color: #FF7E05;
            box-shadow: 0 0 0 3px rgba(255,126,5,0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF7E05 0%, #ef3b00 100%);
            color: white; border: none; cursor: pointer;
            position: relative; overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px -3px rgba(255, 126, 5, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -3px rgba(255, 126, 5, 0.5);
        }

        .scanner-line {
            position: absolute; left: 0; width: 100%; height: 2px; background: #FF7E05;
            box-shadow: 0 0 10px #FF7E05, 0 0 20px #FF7E05;
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        
        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        .particle {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: rise linear forwards;
            z-index: 1;
        }

        .gear-spin { animation: spin 3s linear infinite; }
        .group:hover .gear-hover { animation: spin 2s linear infinite; }

        .screen-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
    </style>
</head>

    <script>
        const API_BASE = "https://suave-unshackle-chug.ngrok-free.dev";
        window.arquivosGerados = {}; 

        // VARIÁVEIS PARA A PORCENTAGEM SUAVE
        let progressoAtual = 0;
        let progressoAlvo = 0;
        let loopProgresso;

        function animarProgresso() {
            if (progressoAtual < progressoAlvo) {
                progressoAtual++;
                document.getElementById('loading-percentage').innerText = `${progressoAtual}%`;
            }
            // Chama a si mesma a cada 30 milissegundos para dar o efeito de contagem rápida (1, 2, 3...)
            loopProgresso = setTimeout(animarProgresso, 30);
        }

        // SOM DE CONCLUSÃO (Ding Tecnológico)
        function tocarSomSucesso() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                // Configura um som suave e moderno (Senoide subindo levemente o tom)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.1); 
                
                // Volume suave que desaparece
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); 
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6); 
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.7);
            } catch (e) {
                console.log("Áudio bloqueado pelo navegador, aguardando interação.");
            }
        }

        function tocarVozAcolhedora() {
            if (!sessionStorage.getItem('vozOuvidaModesta')) {
                if ('speechSynthesis' in window) {
                    const texto = "Olá, vamos criar legenda hoje?";
                    const mensagem = new SpeechSynthesisUtterance(texto);
                    mensagem.lang = 'pt-BR';
                    mensagem.rate = 1.0; 
                    mensagem.pitch = 0.5; // Voz mais grave (Masculina)
                    
                    window.speechSynthesis.speak(mensagem);
                    sessionStorage.setItem('vozOuvidaModesta', 'true');
                }
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            tocarVozAcolhedora();
            
            const startScreen = document.getElementById('start-screen');
            const mainUI = document.getElementById('main-ui');
            
            startScreen.classList.add('screen-out');
            
            setTimeout(() => {
                startScreen.style.display = 'none'; 
                mainUI.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-8'); 
                mainUI.classList.add('translate-y-0');
            }, 600);
        });

        document.getElementById('input-link-video').addEventListener('input', function() {
            if(this.value.includes('http')) {
                document.getElementById('wrapper-cortes').classList.remove('disabled');
            } else if (document.getElementById('input-file-video').files.length === 0) {
                document.getElementById('wrapper-cortes').classList.add('disabled');
            }
        });

        document.getElementById('input-file-video').addEventListener('change', function() {
            if(this.files.length > 0) {
                const fileName = this.files[0].name;
                const displayName = fileName.length > 25 ? fileName.substring(0, 22) + '...' : fileName;
                const displayEl = document.getElementById('file-name-display');
                displayEl.innerText = displayName;
                displayEl.classList.add('text-brand-500');
                document.getElementById('wrapper-cortes').classList.remove('disabled');
            } else if (document.getElementById('input-link-video').value.trim() === '') {
                document.getElementById('wrapper-cortes').classList.add('disabled');
            }
        });

        let intervaloFrases, intervaloParticulas;
        const frasesProcesso = [
            "Mapeando espectro de voz em alta definição...",
            "Sincronizando frames com palavras exatas...",
            "Fatiando texto para leitura dinâmica...",
            "Revisando pontuação e contexto lógico...",
            "Preparando SRT perfeito para a timeline..."
        ];

        function iniciarAnimacoesOverlay() {
            const container = document.getElementById('particles-container');
            if (container) container.innerHTML = '';
            
            intervaloParticulas = setInterval(() => {
                const p = document.createElement('div');
                p.className = `particle ${Math.random() > 0.5 ? 'bg-brand-500' : 'bg-brisa-blue'}`;
                const size = Math.random() * 6 + 3;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}vw`;
                p.style.animationDuration = `${Math.random() * 2 + 2.5}s`; 
                if (container) container.appendChild(p);
                
                setTimeout(() => { if (p.parentNode) p.remove(); }, 5000);
            }, 150);

            const subtitle = document.getElementById('processing-subtitle');
            let index = 0;
            if (subtitle) {
                subtitle.innerText = frasesProcesso[0];
                subtitle.style.opacity = '1';
                
                intervaloFrases = setInterval(() => {
                    subtitle.style.opacity = '0';
                    setTimeout(() => {
                        index = (index + 1) % frasesProcesso.length;
                        subtitle.innerText = frasesProcesso[index];
                        subtitle.style.opacity = '1';
                    }, 500); 
                }, 3000);
            }
        }

        function pararAnimacoesOverlay() {
            clearInterval(intervaloParticulas);
            clearInterval(intervaloFrases);
        }

        function baixarArquivoDireto(nomeArquivo) {
            try {
                const arq = window.arquivosGerados[nomeArquivo];
                
                const byteCharacters = atob(arq.conteudo);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                
                let mimeType = arq.tipo === 'srt' ? 'text/plain;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                const blob = new Blob([byteArray], { type: mimeType });

                const urlBlob = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = urlBlob;
                a.download = arq.arquivo;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(urlBlob);
                }, 100);

            } catch (e) {
                alert("Falha ao baixar o arquivo.");
                console.error(e);
            }
        }

        async function executarIA() {
            const linkVideo = document.getElementById('input-link-video').value.trim();
            const videoFile = document.getElementById('input-file-video').files[0];
            const overlay = document.getElementById('processing-overlay');
            
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            
            // Inicia a porcentagem suave e as animações de fundo
            progressoAtual = 0;
            progressoAlvo = 0;
            clearTimeout(loopProgresso);
            animarProgresso(); 
            iniciarAnimacoesOverlay(); 

            try {
                let formData = new FormData();
                if (videoFile) formData.append("video_file", videoFile);
                else formData.append("link_video", linkVideo);

                await fetch(`${API_BASE}/processar-video`, {
                    method: 'POST',
                    headers: { 'ngrok-skip-browser-warning': 'true' },
                    body: formData
                });

                let poll = setInterval(async () => {
                    try {
                        const res = await fetch(`${API_BASE}/status`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
                        const statusData = await res.json();
                        
                        // Atualiza o alvo, a função animarProgresso vai perseguir esse número!
                        progressoAlvo = statusData.progresso;

                        if (statusData.erro) {
                            clearInterval(poll);
                            pararAnimacoesOverlay();
                            fecharOverlay();
                            clearTimeout(loopProgresso);
                            setTimeout(() => alert("Desculpe, ocorreu um erro: " + statusData.erro), 500);
                        }

                        if(statusData.progresso === 100) {
                            clearInterval(poll);
                            progressoAlvo = 100; // Garante que vá até o final
                            
                            // Dá um tempinho de 1.2s para os números subirem rápido até 100% na tela
                            setTimeout(() => {
                                pararAnimacoesOverlay();
                                clearTimeout(loopProgresso);
                                tocarSomSucesso(); // <-- TOCA O DING!
                                fecharOverlay();
                                montarBotoesDownload(statusData.modulos);
                            }, 1200); 
                        }
                    } catch (e) {
                        console.error("Erro no polling:", e);
                    }
                }, 2000);

            } catch (error) {
                pararAnimacoesOverlay();
                fecharOverlay();
                clearTimeout(loopProgresso);
                setTimeout(() => alert("Houve um problema de conexão. Tente novamente."), 300);
            }
        }

        function fecharOverlay() {
            const overlay = document.getElementById('processing-overlay');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.style.display = 'none', 500);
        }

        function montarBotoesDownload(modulos) {
            const list = document.getElementById('download-buttons-list');
            list.innerHTML = '';

            modulos.forEach(item => {
                window.arquivosGerados[item.arquivo] = item; 
                list.innerHTML += `
                    <button onclick="baixarArquivoDireto('${item.arquivo}')" class="w-full p-3 md:p-4 bg-white border border-gray-100 text-gray-700 rounded-xl font-figtree font-bold flex items-center justify-between hover:border-brisa-blue hover:shadow-md transition-all cursor-pointer text-left group">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-brisa-light text-brisa-blue flex items-center justify-center group-hover:bg-brisa-blue group-hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </div>
                            <span class="text-sm">${item.modulo}</span>
                        </div>
                        <span class="text-[10px] bg-gray-50 px-2 py-1 rounded text-gray-500 group-hover:text-brisa-blue font-bold uppercase tracking-wide border border-gray-100">Baixar</span>
                    </button>`;
            });

            document.getElementById('download-zone').classList.remove('hidden');
        }
    </script>
</body>
</html>
